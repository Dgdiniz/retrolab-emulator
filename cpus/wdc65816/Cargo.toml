[package]
name = "wdc65816"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WDC 65C816 CPU emulation (also Ricoh 5A22 for SNES)"

[dependencies]
retro-core = { path = "../../retro-core" }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# Compiles the `singlestep` module (Tom Harte SingleStepTests runner) and
# pulls in serde/serde_json. Off by default so the core/WASM builds stay lean.
singlestep = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
# Self dev-dependency that turns on `singlestep` whenever the crate's own
# tests build, so `cargo test -p wdc65816` keeps working without an extra
# `--features` flag.
wdc65816 = { path = ".", features = ["singlestep"] }

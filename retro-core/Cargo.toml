[package]
name = "retro-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Common traits and types for retro console emulators"

[features]
# The capture conformance suite (`capture::conformance`), which each core's
# tests run against its own emulator.
capture-conformance = []
# The frame driver's conformance suite (`frame::conformance`), which each
# core's tests run against its own emulator.
frame-conformance = []
# The machine's conformance suite (`emulator::conformance`), which each
# core's tests run against its own emulator.
emulator-conformance = []
# The sound conformance suite (`audio::conformance`), which each core's
# tests run against its own emulator.
sound-conformance = []
# The runner of CPU test vectors (`testing::singlestep`), which the CPU
# crates' and the cores' tests run with their own CPU under test.
singlestep = ["dep:flate2"]
# `audio::vgm::gzip`, which makes a `.vgz` of a VGM.
vgz = ["dep:flate2"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
bincode = "1.3"
sha2 = "0.10"
zstd = "0.13"  # Savestate envelope compression
# The test vectors' gzipped files, read by `testing::singlestep`, and the
# `.vgz` files `audio::vgm::gzip` writes.
flate2 = { version = "1.0", optional = true }

# WASM-specific: js_sys::Date::now() in GenericInputManager::current_time_ms
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
serde_json = { workspace = true }
bincode = "1.3"


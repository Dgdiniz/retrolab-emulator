# The license policy of the emulator's dependency graph.
#
#   cargo deny check licenses        (from this directory)
#
# It reads the workspace built without its default features. Run
# `cargo deny --all-features check licenses` to read every feature as well
# (the three coprocessors and the NEC DSP's low-level emulation, all this
# tree's own code): it passes too, and neither reading leaves a crate out.

[graph]
no-default-features = true

[licenses]
# Permissive licenses, and MPL-2.0, whose copyleft stops at the file and
# asks nothing of the code that links to it. Nothing that would oblige a
# program using the emulator to publish its own source.
allow = [
    "ISC",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
confidence-threshold = 0.9
# The list is the policy, not an inventory: a license on it that no
# dependency uses today is not a finding.
unused-allowed-license = "allow"

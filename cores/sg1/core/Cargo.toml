[package]
name = "sg1-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
# ISC for this crate, and BSD 3-Clause for two things inside it: the three
# FM tables generated from ymfm's data, and the SVP's 68000-side handlers,
# which follow the ones written for PicoDrive. Both notices are at the end
# of `LICENSE`.
license = "ISC AND BSD-3-Clause"
repository.workspace = true
description = "Sega Genesis (Mega Drive) emulator core"

[dependencies]
retro-core = { path = "../../../retro-core" }
ssp1601 = { path = "../../../cpus/ssp1601" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
zstd = "0.13"  # Compression for save states
sha2 = "0.10"  # Canonical ROM digest for cartridge manifests

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
# The capture, machine, frame and sound conformance suites, which
# `tests/capture_conformance.rs`, `tests/emulator_conformance.rs`,
# `tests/frame_conformance.rs` and `tests/sound_conformance.rs` run, the
# golden-image harness, which `tests/image_goldens.rs` and the sprite
# export's test run, and the test-vector runner, which
# `tests/tom_harte_runner.rs` and `tests/singlestep_runner.rs` run; the
# core's own build leaves them out.
retro-core = { path = "../../../retro-core", features = ["capture-conformance", "emulator-conformance", "frame-conformance", "image-goldens", "singlestep", "sound-conformance"] }
serde_json = { workspace = true }
criterion = "0.5"
paste = "1.0"

[[bench]]
name = "cartridge_performance"
harness = false


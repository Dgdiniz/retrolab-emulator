[package]
name = "sg1-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for the SG1 Genesis/Mega Drive emulator"

[[bin]]
name = "sg1-cli"
path = "src/main.rs"

[dependencies]
sg1-core = { path = "../core" }
# `vgz`: the gzip of a VGM, which `vgm-log --vgz` writes.
retro-core = { path = "../../../retro-core", features = ["vgz"] }
retro-cli = { path = "../../../retro-cli" }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
indicatif = "0.17"
# PNG-only (see retro-core): avoids the avif/rav1e subtree.
image = { version = "0.25", default-features = false, features = ["png"] }

[package]
name = "retro-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The commands the console cores' command-line tools share"

[dependencies]
# The test-vector runner, which the `singlestep` front-end runs.
retro-core = { path = "../retro-core", features = ["singlestep"] }
# `string`: the help texts and defaults a console's facts make at run time.
clap = { version = "4", features = ["derive", "string"] }
anyhow = "1.0"
indicatif = "0.17"
# PNG only: the screenshots and the layers a command writes.
image = { version = "0.25", default-features = false, features = ["png"] }
